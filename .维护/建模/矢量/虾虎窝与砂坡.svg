<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1390" viewBox="0 0 1080 1390">
<style>
text{font-family:'PingFang SC','Heiti SC',sans-serif;fill:#243747;font-size:25px}
.title{font-size:34px;font-weight:600}.sub{font-size:23px;fill:#526472}.num{font-size:27px;font-weight:600;fill:#fff;text-anchor:middle;dominant-baseline:central}.dim{font-size:23px}
