  <path d="M0 -51 V-73 M-9 -63 L0 -73 L9 -63" fill="none" stroke="#77568b" stroke-width="3"/>
 </g>
</g>
<circle cx="226" cy="290" r="22" fill="#77568b"/><text x="226" y="290" class="num">1</text>
<circle cx="352" cy="219" r="22" fill="#3e7f6a"/><text x="352" y="219" class="num">2</text>
<circle cx="551" cy="263" r="22" fill="#607d89"/><text x="551" y="263" class="num">3</text>
<text x="96" y="763">前玻璃</text><text x="493" y="763" class="dim">入口朝左前，左/后侧各留约30</text>
<text x="55" y="808">1 中号窝：左后角斜摆，借石头内收空位，避开石脚</text>
<text x="55" y="849">2 约200×150的侧后砂坡，仅搭配枪虾时加至50～60</text>
<text x="55" y="890">3 整组爪哇石440×300×270，原位置暂不后移</text>
<path d="M55 923 H1025" stroke="#dce5e9" stroke-width="2"/>
<text x="55" y="970" class="title">局部侧剖：门前低、侧后高，窝腔留空</text>
<text x="55" y="1008" class="sub">壳体和入口为示意；按真实开口控制覆砂，不按“埋一半”。</text>
<g transform="translate(0 45)">
 <path d="M95 1210 L95 1120 L130 1120 Q175 1140 210 1180 L210 1210 Z" fill="#e7d4a7"/>
 <path d="M480 1210 L480 1065 Q580 1040 640 1060 Q710 1080 780 1110 L970 1120 L970 1210 Z" fill="#e7d4a7"/>
 <path d="M210 1090 Q245 1045 315 1045 Q480 1045 480 1210" fill="none" stroke="#9970aa" stroke-width="18"/>
 <path d="M745 1210 L745 1110 L720 1060 L742 1018 L817 1030 L846 1085 L885 1110 L887 1210 Z" fill="#c8d2d6" stroke="#7b8f99" stroke-width="3"/>
 <path d="M95 1045 V1210 H970" fill="none" stroke="#658693" stroke-width="4"/>
 <circle cx="319" cy="1125" r="22" fill="#77568b"/><text x="319" y="1125" class="num">1</text>
 <circle cx="594" cy="1128" r="22" fill="#3e7f6a"/><text x="594" y="1128" class="num">2</text>
 <circle cx="800" cy="1128" r="22" fill="#607d89"/><text x="800" y="1128" class="num">3</text>
 <text x="120" y="1110" class="sub">门前</text><text x="120" y="1140" class="sub">不堵口</text>
 <text x="530" y="1030">50～60 mm</text>
 <text x="901" y="1103" text-anchor="middle" class="sub">其余约30</text>
 <text x="210" y="1251">窝内不塞棉、不填满砂</text>
 <text x="660" y="1251">石脚稳定落玻璃底</text>
</g>
<text x="55" y="1356" class="sub">单养黄守望：不做2号加厚区。保留现有10kg砂，不加碎珊瑚骨。</text>
