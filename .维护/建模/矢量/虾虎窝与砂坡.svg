<rect width="1080" height="1390" fill="#fff"/>
<text x="55" y="52" class="title">虾虎窝与局部砂坡 · 左后角方案</text>
<text x="55" y="90" class="sub">主缸外600×450；内584×434 mm。石形为示意，避让实际承重脚。</text>
<text x="96" y="139">后玻璃</text>
<rect x="96" y="160" width="759.2" height="564.2" rx="1" fill="#f4f8fa" stroke="#658693" stroke-width="3"/>
<rect x="866" y="286" width="156" height="312" fill="#e5edf1" stroke="#658693" stroke-width="2"/>
<text x="944" y="434" text-anchor="middle">右书包</text>
<text x="944" y="472" text-anchor="middle" class="sub">留通水口</text>
<g transform="translate(96 724.2) scale(1.3 -1.3)">
 <path d="M64 122 L82 80 L134 67 L190 81 L211 118 Q240 147 258 178 Q279 206 312 182 Q342 153 355 117 L383 75 L439 88 L488 119 L504 185 L493 250 L453 292 L404 303 L370 349 L303 367 L248 344 L207 309 L164 286 L131 245 L88 224 Z" fill="#c8d2d6" stroke="#7b8f99" stroke-width="2"/>
