<path d="M65 510 H395" stroke="#b5bec3" stroke-width="2" stroke-dasharray="6 6"/><text x="85" y="544" class="note">底缸上沿约在这一带（仅作位置参照）</text>
<text x="86" y="648" class="note">下半部保留余线与维护空间</text>
<text x="86" y="676" class="note">余线宽松折返，不紧盘电源线</text>
<text x="490" y="165" class="label">1　插排：高位横放，插孔朝过道</text>
<text x="490" y="198" class="note">上边距板顶约100mm，前后各留约48mm。</text><text x="490" y="225" class="note">总开关尽量朝柜前；外壳尺寸以实物复测。</text><text x="490" y="252" class="note">插拔方向留约80～100mm手部空间。</text>
<text x="490" y="321" class="label">2　控制器与电源：分开固定</text>
<text x="490" y="354" class="note">控制器常用按钮靠前；电源适配器独立挂架。</text><text x="490" y="381" class="note">电源间先留约20～30mm，散热按本品说明。</text><text x="490" y="408" class="note">电源和市电接头优先留在底缸上沿以上。</text>
<text x="490" y="477" class="label">3　后沿走线：分束、可拆</text>
<text x="490" y="510" class="note">电源线与低压/探头线分束固定。</text><text x="490" y="537" class="note">每个插头、控制器两端贴同名标签。</text><text x="490" y="564" class="note">保留拆泵、提蛋分杯所需的活动余量。</text>
<text x="490" y="633" class="label">4　每条湿设备线：先下垂，再到插头</text>
<text x="490" y="666" class="note">低点低于插孔/接头，让沿线的水先滴落。</text><text x="490" y="693" class="note">不能用一束总线的弯代替每条线的滴水弯。</text>
<text x="45" y="817" class="note">板名义368×818mm；插排约272×100mm。分区示意非钻孔模板；固定孔按底座实物放样。</text>
</svg>
