<text x="65" y="1190" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#19354b" text-anchor="start">初期：开放铝架</text>
<text x="65" y="1235" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#19354b" text-anchor="start">先控制水声、振动，电源和线缆集中固定</text>
<text x="835" y="1190" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700" fill="#19354b" text-anchor="start">未来：可拆实体面板 + 局部洞洞板</text>
<text x="835" y="1235" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#19354b" text-anchor="start">面板厚度纳入外尺寸，右侧不依赖日常检修</text>
<text x="65" y="1335" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" fill="#19354b" text-anchor="start">顶部：灯、风扇、喂食口、溢流检修盖分开安排；防猫结构另核跨度与固定。</text>
<text x="65" y="1400" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="400" fill="#19354b" text-anchor="start">造景：铺砂 + 活石，留玻璃清洁、石后水流和虹吸通道。珊瑚及海葵按生长空间安排。</text>
<text x="65" y="1480" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#c14e55" text-anchor="start">示意中的设备、颜色、盖板及面板均非已购产品，不代表品牌外观已核验或结构已定稿。</text>
