<text x="65" y="135" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#576e7d" font-weight="400" text-anchor="start">节点提案：200×200×6直角三角板 ×16；每块4孔 · 最终材料/沉头/紧固力矩由供方确认</text>
