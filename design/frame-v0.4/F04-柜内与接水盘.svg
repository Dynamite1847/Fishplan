<text x="80" y="1580" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#b64141" font-weight="400" text-anchor="start">盘只能接局部滴漏，不接得住整缸破损；不能用薄软托盘或软泡棉替代已核验承压结构。</text>
<text x="80" y="1630" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#18354a" font-weight="400" text-anchor="start">泵阀由管夹承力；底缸外深改310，旧300深滤盒停用。标高Z0不是房间地面。</text>
