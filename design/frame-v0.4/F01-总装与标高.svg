<text x="70" y="1442" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#18354a" font-weight="400" text-anchor="start">主缸400高、垫3厚时，缸顶约1343；调平垫片另计。900不是整柜最终高度。</text>
<text x="70" y="1496" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#21846b" font-weight="400" text-anchor="start">绿色虚线：底缸420×310×460；正面装入后降到Z63，顶部Z523。</text>
<text x="70" y="1548" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#18354a" font-weight="400" text-anchor="start">16块外置200三角板：每个空间角两块，前后、左右两个方向同时加固。</text>
<text x="70" y="1600" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#b64141" font-weight="400" text-anchor="start">角板挡住正面四角：不能仍把500×820柱间矩形当作完全无遮挡窗口。</text>
<text x="70" y="1650" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#b64141" font-weight="400" text-anchor="start">架体稳定、节点抗滑移、玻璃支撑及板材承载尚待供方核验；本图不是承重证明。</text>
