<text x="1130" y="1280" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#c14e55" text-anchor="start">280：旁通堰口候选</text>
<text x="1130" y="1340" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#19354b" text-anchor="start">255：接水盒堰口候选</text>
<text x="1130" y="1400" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="400" fill="#19354b" text-anchor="start">250：滤篮底 / 主管末端例</text>
<text x="70" y="1580" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#c14e55" text-anchor="start">后盒正常水面不是堰口高度；滤棉堵塞后最高水位按实际流量验证，目标不超过300。</text>
<text x="70" y="1630" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#19354b" text-anchor="start">分隔挡板、模块固定、堰宽和出口未定稿；D2不穿滤棉，水路始终留在底缸内。</text>
<text x="70" y="1690" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#647b8e" text-anchor="start">这是维护与水路原型图，不是可直接裁切的亚克力展开图；尺寸与水位均需试装、试水。</text>
