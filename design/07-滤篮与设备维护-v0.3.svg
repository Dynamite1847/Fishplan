<text x="875" y="250" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700" fill="#19354b" text-anchor="start">本体纸样可放入 ≠ 安装完成</text>
<text x="875" y="310" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#19354b" text-anchor="start">靠后玻璃磁吸，外磁座净空待核</text>
<text x="875" y="365" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#19354b" text-anchor="start">A版前取篮暂缩至82×160</text>
<text x="875" y="420" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#19354b" text-anchor="start">D1留在后区，换棉不拆管</text>
<text x="875" y="475" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#19354b" text-anchor="start">滤篮单独上提，滴水回到底缸</text>
<text x="875" y="530" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#19354b" text-anchor="start">先暂停ATO，完成后核对水位</text>
<text x="875" y="585" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#19354b" text-anchor="start">整模块拆洗另按停泵流程操作</text>
<text x="70" y="960" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="700" fill="#19354b" text-anchor="start">接水盒纵剖面：后接水 → 前滤篮 → 底缸内出水 / 堵塞旁通</text>
